<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台南生活資訊板</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        h1 { margin: 0 0 10px 0; font-size: 20px; font-weight: 600; letter-spacing: 1px;}
        
        /* 時間區塊 */
        .time-box {
            font-size: 42px;
            font-weight: 700;
            margin: 5px 0 10px 0;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
            line-height: 1;
            font-feature-settings: "tnum";
        }
        .date-box { font-size: 15px; opacity: 0.9; margin-bottom: 20px; }

        /* 資訊卡片網格 (2x2) */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .info-card {
            background: rgba(0, 0, 0, 0.25);
            padding: 12px;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 80px; /* 統一高度 */
        }
        .label { font-size: 12px; opacity: 0.8; margin-bottom: 5px; }
        .value { font-size: 22px; font-weight: bold; }
        .unit { font-size: 12px; opacity: 0.8; }
        
        /* 日出日落專用樣式 */
        .sun-time { font-size: 14px; margin: 2px 0; display: flex; align-items: center; }
        .sun-icon { margin-right: 5px; font-size: 16px; }

        .aqi-good { color: #4ade80; } 
        .aqi-moderate { color: #facc15; } 
        .aqi-bad { color: #f87171; } 

        /* 橫向滑動天氣預報 */
        .hourly-title {
            text-align: left;
            font-size: 13px;
            margin-bottom: 8px;
            opacity: 0.8;
            padding-left: 5px;
        }
        .hourly-scroll {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding-bottom: 10px;
            margin-bottom: 15px;
            scrollbar-width: none; 
            -ms-overflow-style: none;
        }
        .hourly-scroll::-webkit-scrollbar { display: none; }
        
        .hour-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            min-width: 60px;
            padding: 10px 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .hour-time { font-size: 12px; opacity: 0.8; margin-bottom: 5px; }
        .hour-icon { font-size: 20px; margin-bottom: 5px; }
        .hour-temp { font-size: 16px; font-weight: bold; }

        /* 路況按鈕 */
        .traffic-section {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 18px;
            padding: 12px;
            margin-top: 5px;
        }
        .traffic-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #4285F4;
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .traffic-icon { margin-right: 8px; font-size: 18px; }

        .footer { margin-top: 20px; font-size: 10px; opacity: 0.5; }
    </style>
</head>
<body>

    <div class="container">
        <h1>📍 台南 Tainan</h1>
        
        <div class="date-box" id="date">載入中...</div>
        <div class="time-box" id="time">--:--:--</div>

        <div class="info-grid">
            <div class="info-card">
                <span class="label">🌡️ 氣溫</span>
                <div>
                    <span class="value" id="temp">--</span>
                    <span class="unit">°C</span>
                </div>
            </div>
            <div class="info-card">
                <span class="label">💧 濕度</span>
                <div>
                    <span class="value" id="humidity">--</span>
                    <span class="unit">%</span>
                </div>
            </div>
            <div class="info-card">
                <span class="label">🍃 空氣品質</span>
                <div>
                    <span class="value" id="aqi">--</span>
                    <span class="unit" id="aqi-text"></span>
                </div>
            </div>
            <div class="info-card" style="justify-content: space-evenly;">
                <div class="sun-time">
                    <span class="sun-icon">🌅</span>
                    <span id="sunrise">--:--</span>
                </div>
                <div class="sun-time">
                    <span class="sun-icon">🌇</span>
                    <span id="sunset">--:--</span>
                </div>
            </div>
        </div>

        <div class="hourly-title">🕓 未來 24 小時預報 (可滑動)</div>
        <div class="hourly-scroll" id="hourly-container">
            <div class="hour-card">
                <span class="hour-time">--:--</span>
                <span class="hour-icon">⌛</span>
                <span class="hour-temp">--°</span>
            </div>
        </div>

        <div class="traffic-section">
            <a href="https://www.google.com/maps/dir/台南市東區/南部科學園區" 
               target="_blank" 
               class="traffic-btn">
               <span class="traffic-icon">🚗</span> 東區 ➔ 南科 路況
            </a>
        </div>

        <div class="footer">資料來源: Open-Meteo</div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            document.getElementById('time').innerText = now.toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('date').innerText = now.toLocaleDateString('zh-TW', options);
        }

        function getWeatherIcon(code) {
            if (code === 0) return "☀️";
            if (code >= 1 && code <= 3) return "⛅";
            if (code >= 45 && code <= 48) return "🌫️";
            if (code >= 51 && code <= 67) return "🌧️";
            if (code >= 80 && code <= 99) return "⛈️";
            return "☁️";
        }

        async function fetchData() {
            try {
                // 抓取：氣溫、濕度(新增)、每小時、日出日落(新增)
                const weatherRes = await fetch('https://api.open-meteo.com/v1/forecast?latitude=22.9908&longitude=120.2133&current=temperature_2m,relative_humidity_2m&hourly=temperature_2m,weathercode&daily=sunrise,sunset&forecast_days=2&timezone=auto');
                const weatherData = await weatherRes.json();
                
                // 1. 設定氣溫
                document.getElementById('temp').innerText = Math.round(weatherData.current.temperature_2m);
                
                // 2. 設定濕度 (新增)
                document.getElementById('humidity').innerText = weatherData.current.relative_humidity_2m;

                // 3. 設定日出日落 (新增)
                // API 回傳格式為 "2024-01-01T06:35"，我們只需要 "06:35"
                const sunriseRaw = weatherData.daily.sunrise[0];
                const sunsetRaw = weatherData.daily.sunset[0];
                document.getElementById('sunrise').innerText = sunriseRaw.split('T')[1];
                document.getElementById('sunset').innerText = sunsetRaw.split('T')[1];

                // 4. 設定每小時預報
                const hourlyContainer = document.getElementById('hourly-container');
                hourlyContainer.innerHTML = ""; 
                const currentHourIndex = new Date().getHours(); 

                for (let i = currentHourIndex; i < currentHourIndex + 24; i++) {
                    const timeStr = weatherData.hourly.time[i];
                    const temp = Math.round(weatherData.hourly.temperature_2m[i]);
                    const code = weatherData.hourly.weathercode[i];
                    const hourDisplay = timeStr.split('T')[1];

                    const card = document.createElement('div');
                    card.className = 'hour-card';
                    card.innerHTML = `
                        <span class="hour-time">${hourDisplay}</span>
                        <span class="hour-icon">${getWeatherIcon(code)}</span>
                        <span class="hour-temp">${temp}°</span>
                    `;
                    hourlyContainer.appendChild(card);
                }

                // 5. 抓取 AQI
                const airRes = await fetch('https://air-quality-api.open-meteo.com/v1/air-quality?latitude=22.9908&longitude=120.2133&current=us_aqi&timezone=auto');
                const airData = await airRes.json();
                const aqi = airData.current.us_aqi;
                
                const aqiElem = document.getElementById('aqi');
                const aqiTextElem = document.getElementById('aqi-text');
                
                aqiElem.innerText = aqi;
                aqiElem.className = 'value'; 
                
                if (aqi <= 50) {
                    aqiElem.classList.add('aqi-good');
                    aqiTextElem.innerText = "優";
                } else if (aqi <= 100) {
                    aqiElem.classList.add('aqi-moderate');
                    aqiTextElem.innerText = "普";
                } else {
                    aqiElem.classList.add('aqi-bad');
                    aqiTextElem.innerText = "差";
                }

            } catch (error) {
                console.error("資料錯誤", error);
            }
        }

        setInterval(updateTime, 1000);
        updateTime();
        fetchData();
    </script>
</body>
</html>
